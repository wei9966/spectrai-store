<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>E2NF-IDLE</title>
<style>
  html,body{margin:0;padding:0;background:#ffffff;font-family:Segoe UI,sans-serif}
  textarea{display:block;margin:40px;width:1100px;height:150px;font-size:28px;padding:16px;border:4px solid #333}
  #log{font-size:24px;margin:0 40px;padding:12px;border:3px solid #999;min-height:34px}
</style>
</head>
<body>
<textarea id="ta" spellcheck="false">E2 PREFILLED TEXT FOR SELECT-ALL TEST 0123456789</textarea>
<div id="log">idle</div>
<script>
  // Readout channel = the window title. The browser process updates it even
  // while the window is unfocused, and a foreign process can read it with
  // GetWindowText. Chromium does NOT repaint an inactive window's content,
  // so a bitmap diff is a false negative here -- the title is not.
  //
  //   E2NF-C<n>-K<m>-I<len>
  //     n   = number of Ctrl+A keydown events seen by the page
  //     m   = number of keydown events seen by the page
  //     len = current textarea value length (i.e. text actually inserted)
  var ctrlA = 0, keys = 0;
  var ta = document.getElementById('ta');
  var log = document.getElementById('log');

  function upd() { document.title = 'E2NF-C' + ctrlA + '-K' + keys + '-I' + ta.value.length; }

  window.addEventListener('keydown', function (e) {
    keys++;
    if (e.ctrlKey && (e.key === 'a' || e.key === 'A')) {
      ctrlA++;
      ta.select();
    }
    upd();
    log.textContent = 'key=' + (e.key || ('vk' + e.keyCode)) + ' ctrl=' + e.ctrlKey +
                      ' keys=' + keys + ' ctrlA=' + ctrlA + ' len=' + ta.value.length;
  });

  ta.addEventListener('input', function () { upd(); log.textContent = 'input len=' + ta.value.length; });

  window.addEventListener('paste', function () { document.title = 'E2-PASTE-I' + ta.value.length; });

  upd();
</script>
</body>
</html>
