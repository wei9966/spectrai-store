<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Computer Use Vision Fallback Canvas Fixture</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 760px;
      margin: 64px auto;
      padding: 0 24px;
      line-height: 1.5;
    }
    canvas {
      border: 1px solid #c9d3e0;
      border-radius: 8px;
      background: #fff;
      display: block;
      margin-top: 16px;
    }
    #status {
      margin-top: 16px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <main>
    <h1>Computer Use Vision/HID Fallback Fixture</h1>
    <p>The actionable label is painted into the canvas, so DOM/AX should only expose the canvas container.</p>
    <canvas id="paintedUi" width="520" height="220" aria-label="Painted UI canvas"></canvas>
    <div id="status" data-testid="canvas-status">Canvas status: ready</div>
  </main>
  <script>
    const canvas = document.getElementById('paintedUi')
    const status = document.getElementById('status')
    const ctx = canvas.getContext('2d')
    const button = { x: 120, y: 82, width: 280, height: 58 }

    function draw(clicked = false) {
      ctx.clearRect(0, 0, canvas.width, canvas.height)
      ctx.fillStyle = '#f8fbff'
      ctx.fillRect(0, 0, canvas.width, canvas.height)
      ctx.fillStyle = clicked ? '#0f766e' : '#2563eb'
      ctx.fillRect(button.x, button.y, button.width, button.height)
      ctx.strokeStyle = '#153e75'
      ctx.lineWidth = 2
      ctx.strokeRect(button.x, button.y, button.width, button.height)
      ctx.fillStyle = '#ffffff'
      ctx.font = 'bold 22px system-ui, sans-serif'
      ctx.textAlign = 'center'
      ctx.textBaseline = 'middle'
      ctx.fillText('Painted Canvas Button', button.x + button.width / 2, button.y + button.height / 2)
    }

    function insideButton(x, y) {
      return x >= button.x && x <= button.x + button.width && y >= button.y && y <= button.y + button.height
    }

    canvas.addEventListener('click', (event) => {
      const rect = canvas.getBoundingClientRect()
      const x = event.clientX - rect.left
      const y = event.clientY - rect.top
      if (insideButton(x, y)) {
        status.textContent = 'Canvas status: clicked'
        status.dataset.clicked = 'true'
        draw(true)
      }
    })

    draw(false)
  </script>
</body>
</html>
