<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Computer Use Browser Search Fixture</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 760px;
      margin: 64px auto;
      padding: 0 24px;
      line-height: 1.5;
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
    }
    input[type="search"] {
      width: min(520px, 100%);
      padding: 10px 12px;
      font-size: 16px;
    }
    button {
      padding: 10px 16px;
      margin-left: 8px;
      font-size: 16px;
    }
    #results {
      margin-top: 24px;
      padding: 16px;
      border: 1px solid #c9d3e0;
      border-radius: 8px;
      background: #f8fbff;
    }
  </style>
</head>
<body>
  <main>
    <h1>Computer Use Browser Search Fixture</h1>
    <p>This deterministic page mirrors the selector shape of a search engine form for CDP/DOM benchmark runs.</p>
    <form id="searchForm" action="/search" method="get">
      <label for="kw">Search query</label>
      <input id="kw" name="wd" type="search" data-testid="search-input" autocomplete="off" aria-label="Search query">
      <button id="su" type="submit" data-testid="search-submit">Search</button>
    </form>
    <section id="results" aria-live="polite" data-testid="results">No search submitted.</section>
  </main>
  <script>
    const form = document.getElementById('searchForm')
    const input = document.getElementById('kw')
    const results = document.getElementById('results')

    form.addEventListener('submit', (event) => {
      event.preventDefault()
      const query = input.value.trim()
      const encoded = encodeURIComponent(query)
      history.pushState({}, '', `?wd=${encoded}`)
      results.textContent = query ? `Search submitted for: ${query}` : 'Search submitted with empty query.'
      results.dataset.lastQuery = query
    })
  </script>
</body>
</html>
